<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token ??????</title>
    <style>
        :root { color-scheme: dark; }
        body { font-family: Inter, "Microsoft YaHei", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
        .wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }
        h1, h2 { margin: 0 0 16px; }
        .muted { color: #94a3b8; }
        .grid { display: grid; gap: 16px; }
        .cards { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin: 20px 0; }
        .two { grid-template-columns: 1.2fr 1fr; align-items: start; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; box-shadow: 0 10px 24px rgba(0,0,0,.2); }
        .value { font-size: 26px; font-weight: 700; margin-top: 8px; }
        .label { color: #94a3b8; font-size: 13px; }
        .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        label { font-size: 13px; color: #cbd5e1; display: block; margin-bottom: 6px; }
        input, select { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #020617; color: #e2e8f0; }
        button { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
        .primary { background: #2563eb; color: white; }
        .danger { background: #dc2626; color: white; }
        .ghost { background: #1e293b; color: #e2e8f0; }
        .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #1f2937; text-align: left; vertical-align: top; }
        th { color: #94a3b8; font-weight: 600; }
        .status-SUCCESS { color: #22c55e; }
        .status-FAILED { color: #f59e0b; }
        .status-BLOCKED { color: #ef4444; }
        .trend { display: grid; gap: 8px; margin-top: 12px; }
        .bar { display: grid; grid-template-columns: 88px 1fr 80px 80px; gap: 10px; align-items: center; }
        .bar-track { background: #1f2937; border-radius: 999px; height: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #2563eb, #22c55e); }
        .toast { position: fixed; right: 20px; bottom: 20px; background: #111827; border: 1px solid #334155; padding: 12px 14px; border-radius: 10px; display: none; }
        @media (max-width: 960px) { .two, .row, .row-3 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Token ??????</h1>
    <div class="muted">???? / ?? Token?????????????????????</div>

    <div class="grid cards" id="summary-cards"></div>

    <div class="grid two">
        <section class="card">
            <h2>????</h2>
            <div class="row">
                <div>
                    <label>????</label>
                    <select id="enabled"><option value="true">??</option><option value="false">??</option></select>
                </div>
                <div>
                    <label>????</label>
                    <select id="strictMode"><option value="false">???</option><option value="true">????</option></select>
                </div>
            </div>
            <div class="row-3">
                <div><label>???? Token ??</label><input id="maxEstimatedTokensPerRequest" type="number"></div>
                <div><label>???? Token</label><input id="reservedCompletionTokens" type="number"></div>
                <div><label>???????</label><input id="recentRecords" type="number"></div>
            </div>
            <div class="row-3">
                <div><label>?? Token ??</label><input id="dailyTokenBudget" type="number"></div>
                <div><label>?? Token ??</label><input id="monthlyTokenBudget" type="number"></div>
                <div><label>??</label><input id="currency" type="text"></div>
            </div>
            <div class="row-3">
                <div><label>?????? (USD)</label><input id="dailyBudgetUsd" type="number" step="0.0001"></div>
                <div><label>?????? (USD)</label><input id="monthlyBudgetUsd" type="number" step="0.0001"></div>
                <div></div>
            </div>
            <div class="row-3">
                <div><label>???? / 1M tokens</label><input id="inputPerMillionTokens" type="number" step="0.0001"></div>
                <div><label>???? / 1M tokens</label><input id="outputPerMillionTokens" type="number" step="0.0001"></div>
                <div><label>Embedding ?? / 1M tokens</label><input id="embeddingPerMillionTokens" type="number" step="0.0001"></div>
            </div>
            <div class="actions">
                <button class="primary" onclick="saveSettings()">????</button>
                <button class="ghost" onclick="loadAll()">????</button>
                <button class="danger" onclick="clearRecords()">????</button>
            </div>
        </section>

        <section class="card">
            <h2>? 7 ???</h2>
            <div class="muted">???????????????????</div>
            <div class="trend" id="trend"></div>
        </section>
    </div>

    <section class="card" style="margin-top: 16px;">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;">
            <div>
                <h2>??????</h2>
                <div class="muted">?????????????????</div>
            </div>
            <div><input id="limit" type="number" value="100" min="10" max="500" style="width:120px"></div>
        </div>
        <div style="overflow:auto;margin-top:12px;">
            <table>
                <thead>
                <tr>
                    <th>??</th>
                    <th>??</th>
                    <th>??</th>
                    <th>??</th>
                    <th>??</th>
                    <th>??</th>
                    <th>??</th>
                    <th>Embedding</th>
                    <th>? Token</th>
                    <th>????</th>
                    <th>??</th>
                </tr>
                </thead>
                <tbody id="records"></tbody>
            </table>
        </div>
    </section>
</div>

<div class="toast" id="toast"></div>

<script>
    const api = '/api/admin/cost';

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2400);
    }

    function money(v, currency = 'USD') {
        return `${currency} ${Number(v || 0).toFixed(4)}`;
    }

    function number(v) { return Number(v || 0).toLocaleString(); }

    function formatTime(ts) {
        return new Date(ts).toLocaleString('zh-CN', { hour12: false });
    }

    async function fetchJson(url, options) {
        const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '????');
        return data;
    }

    async function loadSummary() {
        const data = await fetchJson(`${api}/summary`);
        const currency = data.settings.currency || 'USD';
        const cards = [
            ['????', data.today.requestCount],
            ['????? Token', data.today.billableTokens],
            ['??????', money(data.today.estimatedCostUsd, currency)],
            ['????', data.month.requestCount],
            ['???? Token', data.month.billableTokens],
            ['??????', money(data.month.estimatedCostUsd, currency)],
            ['?????', data.total.blockedCount],
            ['????', data.total.failedCount]
        ];
        document.getElementById('summary-cards').innerHTML = cards.map(([label, value]) => `
            <div class="card"><div class="label">${label}</div><div class="value">${typeof value === 'string' ? value : number(value)}</div></div>
        `).join('');

        const trend = data.dailyTrend || [];
        const maxTokens = Math.max(...trend.map(item => item.tokens), 1);
        document.getElementById('trend').innerHTML = trend.map(item => `
            <div class="bar">
                <div>${item.date}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${(item.tokens / maxTokens) * 100}%"></div></div>
                <div>${number(item.tokens)}</div>
                <div>${money(item.costUsd, currency)}</div>
            </div>
        `).join('');
    }

    async function loadSettings() {
        const data = await fetchJson(`${api}/settings`);
        for (const [k, v] of Object.entries(data)) {
            const el = document.getElementById(k);
            if (el) el.value = v;
        }
    }

    async function loadRecords() {
        const limit = document.getElementById('limit').value || 100;
        const rows = await fetchJson(`${api}/records?limit=${limit}`);
        document.getElementById('records').innerHTML = rows.map(row => `
            <tr>
                <td>${formatTime(row.timestamp)}</td>
                <td class="status-${row.status}">${row.status}</td>
                <td>${row.usageType}</td>
                <td>${row.source || ''}</td>
                <td>${row.model || ''}</td>
                <td>${number(row.inputTokens)}</td>
                <td>${number(row.outputTokens)}</td>
                <td>${number(row.embeddingTokens)}</td>
                <td>${number(row.totalTokens)}</td>
                <td>${money(row.estimatedCostUsd)}</td>
                <td>${row.note || ''}</td>
            </tr>
        `).join('');
    }

    async function saveSettings() {
        const payload = {
            enabled: document.getElementById('enabled').value === 'true',
            strictMode: document.getElementById('strictMode').value === 'true',
            recentRecords: Number(document.getElementById('recentRecords').value),
            maxEstimatedTokensPerRequest: Number(document.getElementById('maxEstimatedTokensPerRequest').value),
            reservedCompletionTokens: Number(document.getElementById('reservedCompletionTokens').value),
            dailyTokenBudget: Number(document.getElementById('dailyTokenBudget').value),
            monthlyTokenBudget: Number(document.getElementById('monthlyTokenBudget').value),
            dailyBudgetUsd: Number(document.getElementById('dailyBudgetUsd').value),
            monthlyBudgetUsd: Number(document.getElementById('monthlyBudgetUsd').value),
            pricing: {
                currency: document.getElementById('currency').value,
                inputPerMillionTokens: Number(document.getElementById('inputPerMillionTokens').value),
                outputPerMillionTokens: Number(document.getElementById('outputPerMillionTokens').value),
                embeddingPerMillionTokens: Number(document.getElementById('embeddingPerMillionTokens').value)
            }
        };
        await fetchJson(`${api}/settings`, { method: 'PUT', body: JSON.stringify(payload) });
        showToast('?????');
        await loadAll();
    }

    async function clearRecords() {
        if (!confirm('????????????????')) return;
        await fetchJson(`${api}/records`, { method: 'DELETE' });
        showToast('?????');
        await loadAll();
    }

    async function loadAll() {
        await Promise.all([loadSummary(), loadSettings(), loadRecords()]);
    }

    document.getElementById('limit').addEventListener('change', loadRecords);
    loadAll().catch(err => showToast(err.message || '????'));
</script>
</body>
</html>
