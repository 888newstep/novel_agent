server:
  port: 8080

app:
  security:
    # 管理接口必须显式配置密钥；未配置时返回 503，避免误开放高危操作。
    admin-api-key: ${NOVEL_AGENT_ADMIN_API_KEY:}
  file-access:
    # 使用分号分隔多个允许根目录，路径相对于应用工作目录时会先规范化。
    allowed-roots: ${NOVEL_AGENT_FILE_ALLOWED_ROOTS:novels;artifacts}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: novel-agent

  datasource:
    url: jdbc:mysql://localhost:3306/novel_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# =============================================
# DeepSeek API 配置
# =============================================
ai:
  model:
    provider: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:your-api-key}
      model-name: deepseek-chat
      base-url: https://api.deepseek.com/v1
    qianwen:
      api-key: ${QIANWEN_API_KEY:your-api-key}
      model-name: qwen-max
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    local:
      base-url: http://localhost:11434/v1
      model-name: qwen2.5:7b
      api-key: dummy
    fallback:
      enabled: true
      max-retries: 1

  embedding:
    provider: siliconflow        # ollama | siliconflow
    cache-size: ${NOVEL_AGENT_EMBEDDING_CACHE_SIZE:1024}
    cache-max-text-chars: ${NOVEL_AGENT_EMBEDDING_CACHE_MAX_TEXT_CHARS:512}
    ollama:
      base-url: http://localhost:11434
      model-name: bge-m3
      dimension: 1024
    siliconflow:
      base-url: https://api.siliconflow.cn/v1
      model-name: BAAI/bge-m3
      dimension: 1024
      api-key: ${SILICONFLOW_API_KEY}

  cost-control:
    enabled: true
    strict-mode: false
    recent-records: 200
    max-estimated-tokens-per-request: 16000
    reserved-completion-tokens: ${NOVEL_AGENT_RESERVED_COMPLETION_TOKENS:2500}
    daily-token-budget: 600000
    monthly-token-budget: 8000000
    daily-budget-usd: 10.0
    monthly-budget-usd: 200.0
    per-novel-daily-token-budget: 0
    per-novel-daily-budget-usd: 0.0
    per-model-daily-token-budget: 0
    per-model-daily-budget-usd: 0.0
    degrade-on-budget-exceeded: true
    degrade-on-model-failure: true
    degrade-on-embedding-failure: true
    pricing:
      currency: USD
      input-per-million-tokens: 0.0        # ?????????????????
      output-per-million-tokens: 0.0       # ?????????????????
      embedding-per-million-tokens: 0.0    # ?????????????????

# =============================================
# Ollama Embedding（本地 WSL2）
# =============================================
ollama:
  host: http://localhost:11434
  model: bge-m3

# =============================================
# Milvus（云服务器）
# =============================================
milvus:
  host: ${MILVUS_HOST:100.80.77.105}
  port: ${MILVUS_PORT:19530}
  collection:
    segments: novel_segments
    events: novel_events
    characters: novel_characters
    items: novel_items
    faction_inspire: novel_faction_inspire
  write:
    batch-size: 18                        # 450 chars × 18 = 8100 tokens < 8192
    flush-interval: 28                    # 每 N 批执行一次 flush
  import:
    max-retries: 3
    retry-backoff-ms: 1000
  lifecycle:
    auto-load: true

logging:
  level:
    root: INFO
    com.novel.agent: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

knowledge:
  novel-dir: novels/           # TXT 小说存放目录
  batch-size: 10               # 批量处理大小

retrieval:
  search:
    ef-search: 512
    default-fetch-multiplier: 10
    max-query-variants: 3
    max-query-chars: ${NOVEL_AGENT_RETRIEVAL_MAX_QUERY_CHARS:240}
    max-total-query-chars: ${NOVEL_AGENT_RETRIEVAL_MAX_TOTAL_QUERY_CHARS:480}
    per-chapter-segment-limit: 1
    per-chapter-event-limit: 1
  memory:
    prompt-token-budget: ${NOVEL_AGENT_PROMPT_TOKEN_BUDGET:6000}
    recent-chapter-limit: 5
    segment-limit: 5
    hook-limit: 4
    character-limit: 5
    item-limit: 2
    faction-limit: 2
    relation-limit: 3
  ranking:
    keyword-hit-weight: 0.12
    variant-hit-weight: 0.08
    primary-field-keyword-hit-weight: 0.18
    primary-field-exact-match-bonus: 0.25
    unresolved-event-bonus: 0.20
    plot-hook-bonus: 0.12
    exact-match-bonus: 0.18
    recency-max-boost: 0.15
    chapter-proximity-weight: 0.30
  hints:
    segment: 章节片段 续写 上下文
    event: 事件 伏笔 设定
    character: 人物 关系 设定
    item: 道具 状态 归属
    faction: 势力 灵感 设定
    current-chapter: 当前章节 上下文 续写

# =============================================
# AI 痕迹自检器（P0：R1/R3/R5/R8 四规则）
# =============================================
ai-trace:
  enabled: true
  dictionary-path: ai_trace_phrases_zh.txt
  phrase-density-threshold: 3.0          # R1：套话密度，次/千字
  transition-density-threshold: 2.0      # R5：转折词密度，次/千字
  sentence-length-sigma-threshold: 6.0   # R3：句长标准差阈值
  min-sentences-for-variance: 8          # R3：最低判定句数
  ending-hook-min-match: 2               # R8：末2段至少命中模板数
  min-char-count: 200                    # 低于该汉字数标记低置信
  max-flagged-sentences: 10
  max-text-chars: 50000
  rules-version: aitrace-v1-p0
