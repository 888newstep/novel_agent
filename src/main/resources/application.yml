server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: novel-agent

  datasource:
    url: jdbc:mysql://localhost:3306/novel_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# =============================================
# DeepSeek API 配置
# =============================================
ai:
  model:
    provider: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:your-api-key}
      model-name: deepseek-chat
      base-url: https://api.deepseek.com/v1
    qianwen:
      api-key: ${QIANWEN_API_KEY:your-api-key}
      model-name: qwen-max
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    local:
      base-url: http://localhost:11434/v1
      model-name: qwen2.5:7b
      api-key: dummy
    fallback:
      enabled: true
      max-retries: 1

  embedding:
    provider: siliconflow        # ollama | siliconflow
    ollama:
      base-url: http://localhost:11434
      model-name: bge-m3
      dimension: 1024
    siliconflow:
      base-url: https://api.siliconflow.cn/v1
      model-name: BAAI/bge-m3
      dimension: 1024
      api-key: ${SILICONFLOW_API_KEY}

  cost-control:
    enabled: true
    strict-mode: false
    recent-records: 200
    max-estimated-tokens-per-request: 12000
    reserved-completion-tokens: 1200
    daily-token-budget: 300000
    monthly-token-budget: 5000000
    daily-budget-usd: 5.0
    monthly-budget-usd: 100.0
    per-novel-daily-token-budget: 0
    per-novel-daily-budget-usd: 0.0
    per-model-daily-token-budget: 0
    per-model-daily-budget-usd: 0.0
    degrade-on-budget-exceeded: true
    degrade-on-model-failure: true
    degrade-on-embedding-failure: true
    pricing:
      currency: USD
      input-per-million-tokens: 0.0        # ?????????????????
      output-per-million-tokens: 0.0       # ?????????????????
      embedding-per-million-tokens: 0.0    # ?????????????????

# =============================================
# Ollama Embedding（本地 WSL2）
# =============================================
ollama:
  host: http://localhost:11434
  model: bge-m3

# =============================================
# Milvus（云服务器）
# =============================================
milvus:
  host: ${MILVUS_HOST:49.234.187.76}
  port: ${MILVUS_PORT:19530}
  collection:
    segments: novel_segments
    events: novel_events
    characters: novel_characters
    items: novel_items
    faction_inspire: novel_faction_inspire
  write:
    batch-size: 18                        # 450 chars × 18 = 8100 tokens < 8192
    flush-interval: 28                    # 每 N 批执行一次 flush
  import:
    max-retries: 3
    retry-backoff-ms: 1000
  lifecycle:
    auto-load: true

logging:
  level:
    root: INFO
    com.novel.agent: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

knowledge:
  novel-dir: novels/           # TXT 小说存放目录
  batch-size: 10               # 批量处理大小

retrieval:
  search:
    ef-search: 64
    default-fetch-multiplier: 2
    max-query-variants: 3
    per-chapter-segment-limit: 1
    per-chapter-event-limit: 1
  memory:
    recent-chapter-limit: 3
    segment-limit: 3
    hook-limit: 2
    character-limit: 3
    item-limit: 1
    faction-limit: 1
    relation-limit: 2
  ranking:
    keyword-hit-weight: 0.10
    variant-hit-weight: 0.06
    primary-field-keyword-hit-weight: 0.14
    primary-field-exact-match-bonus: 0.20
    unresolved-event-bonus: 0.18
    plot-hook-bonus: 0.10
    exact-match-bonus: 0.16
    recency-max-boost: 0.12
  hints:
    segment: 章节片段 续写 上下文
    event: 事件 伏笔 设定
    character: 人物 关系 设定
    item: 道具 状态 归属
    faction: 势力 灵感 设定
    current-chapter: 当前章节 上下文 续写
