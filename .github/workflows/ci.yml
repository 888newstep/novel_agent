name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build And Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: novel_agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create .env for CI
        run: cp .env.example .env

      - name: Compile
        run: mvn compile -B

      - name: Run tests
        run: mvn test -DskipITs -B

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: novel_agent/target/surefire-reports
